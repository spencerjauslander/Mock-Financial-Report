<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger &amp; Line — Twelve-Company Financial Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0D10;
    --panel: #14181D;
    --panel-2: #191E24;
    --border: #262B33;
    --border-soft: #1D222A;
    --text: #E9E6DD;
    --text-dim: #9AA0AA;
    --text-faint: #5F6570;
    --gold: #C9A227;
    --gold-soft: rgba(201,162,39,0.14);
    --teal: #45C7B8;
    --red: #E0685E;
    --blue: #6C93C7;
    --grid-line: #21262E;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1400px;margin:0 auto;padding:0 28px 80px;}
  .masthead{
    padding:36px 0 22px;
    border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:18px;
  }
  .masthead h1{
    font-family:'Spectral',serif;
    font-weight:500;
    font-size:30px;
    margin:0 0 6px;
    letter-spacing:0.2px;
    color:var(--text);
  }
  .masthead .rule{
    display:inline-block;width:34px;height:2px;background:var(--gold);
    margin-right:12px;vertical-align:middle;position:relative;top:-4px;
  }
  .masthead p{margin:0;color:var(--text-dim);font-size:13px;max-width:560px;}
  .masthead .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;color:var(--text-faint);
    text-align:right;line-height:1.7;
  }
  .masthead .meta b{color:var(--gold);font-weight:500;}

  nav.tabs{
    display:flex;gap:2px;margin-top:26px;border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;color:var(--text-dim);
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;
    padding:12px 18px 13px;cursor:pointer;white-space:nowrap;
    border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .15s,border-color .15s;
  }
  nav.tabs button:hover{color:var(--text);}
  nav.tabs button.active{color:var(--gold);border-bottom-color:var(--gold);}

  .filterbar{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:16px 0;margin-bottom:6px;border-bottom:1px solid var(--border-soft);
  }
  .filtergroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .filtergroup .flabel{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;
    color:var(--text-faint);text-transform:uppercase;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    padding:4px 9px;border-radius:2px;border:1px solid var(--border);
    background:var(--panel);color:var(--text-dim);cursor:pointer;
    user-select:none;transition:all .12s;
  }
  .chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);}
  .chip:hover{border-color:var(--text-dim);}
  .chip.all{color:var(--teal);}
  .yearsel{
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:2px;padding:4px 6px;
  }
  .filter-hint{font-size:11px;color:var(--text-faint);margin-left:auto;}

  .page{display:none;padding-top:22px;}
  .page.active{display:block;}
  .grid{display:grid;gap:18px;}
  .grid.cols-2{grid-template-columns:1.3fr 1fr;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){.grid.cols-2,.grid.cols-4{grid-template-columns:1fr;}}

  .panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:20px 22px;
  }
  .panel h2{
    font-family:'Spectral',serif;font-weight:500;font-size:17px;margin:0 0 3px;
  }
  .panel .sub{color:var(--text-faint);font-size:11.5px;margin:0 0 16px;}
  .panel.tight{padding:16px 18px;}

  .kpi{padding:18px 20px;}
  .kpi .label{font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
  .kpi .value{font-family:'Spectral',serif;font-size:30px;color:var(--text);font-weight:500;}
  .kpi .value.accent{color:var(--gold);}
  .kpi .note{font-size:11.5px;color:var(--text-dim);margin-top:6px;}

  svg text{font-family:'IBM Plex Mono',monospace;fill:var(--text-dim);}
  .barlabel{font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;fill:var(--text);}
  .axislabel{font-size:10px;fill:var(--text-faint);}
  .barval{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:var(--text-dim);}

  table.heat{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  table.heat th{
    color:var(--text-faint);font-weight:400;text-align:center;padding:4px 3px;
    border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);
  }
  table.heat th.rowhead{text-align:left;font-family:'IBM Plex Sans',sans-serif;color:var(--text-dim);}
  table.heat td{text-align:center;padding:5px 3px;color:#0B0D10;font-weight:500;}
  table.heat td.rowhead{
    text-align:left;color:var(--text);font-family:'IBM Plex Sans',sans-serif;
    font-size:12px;padding-right:10px;background:var(--panel)!important;font-weight:500;
  }
  table.heat td.empty{background:var(--panel-2)!important;color:var(--text-faint)!important;font-weight:400;}
  .heatwrap{overflow-x:auto;}

  table.diag{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  table.diag th{
    text-align:right;color:var(--text-faint);font-weight:400;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.03em;padding:6px 10px;border-bottom:1px solid var(--border);
  }
  table.diag th:first-child,table.diag td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;}
  table.diag td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);}
  table.diag tr:hover td{background:var(--panel-2);}
  table.diag tfoot td{font-weight:600;border-top:1px solid var(--border);border-bottom:none;color:var(--gold);}

  .legend{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--text-dim);margin-top:10px;flex-wrap:wrap;}
  .legend .dot{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:5px;vertical-align:middle;}
  .note-box{
    font-size:12px;color:var(--text-dim);background:var(--panel-2);border-left:2px solid var(--gold);
    padding:10px 14px;margin-top:14px;border-radius:0 2px 2px 0;
  }
  .note-box b{color:var(--gold);font-weight:500;}
  .textcol{max-width:760px;}
  .textcol h3{font-family:'Spectral',serif;font-size:15.5px;font-weight:600;margin:20px 0 6px;color:var(--gold);}
  .textcol h3:first-child{margin-top:0;}
  .textcol p{color:var(--text-dim);font-size:13px;margin:0 0 10px;}
  .textcol strong{color:var(--text);}

  .footer{
    margin-top:50px;padding-top:18px;border-top:1px solid var(--border);
    color:var(--text-faint);font-size:11px;font-family:'IBM Plex Mono',monospace;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .empty-state{color:var(--text-faint);font-size:12.5px;padding:30px 0;text-align:center;font-style:italic;}
</style>
</head>

function fmtPct(v, d=1){ if(v===null||v===undefined||isNaN(v)) return '—'; return v.toFixed(d)+'%'; }
function mean(arr){ const a = arr.filter(v=>v!==null&&v!==undefined&&!isNaN(v)); return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; }

function inYearRange(y){ return y>=state.yFrom && y<=state.yTo; }
function activeCompanies(){ return RAW.companies.filter(c=>state.companies.has(c)); }

function filterRows(rows){
  return rows.filter(r=>state.companies.has(r.company) && inYearRange(r.year));
}

function groupAvg(rows, field){
  const byC = {};
  rows.forEach(r=>{ if(r[field]===null||r[field]===undefined) return; (byC[r.company]=byC[r.company]||[]).push(r[field]); });
  const out = {};
  Object.keys(byC).forEach(c=> out[c]=mean(byC[c]));
  return out;
}

function pivot(rows, field){
  const out = {};
  rows.forEach(r=>{
    out[r.company] = out[r.company] || {};
    out[r.company][r.year] = r[field];
  });
  return out;
}

// color interpolation
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function lerp(a,b,t){ return a+(b-a)*t; }
function mixColor(c1,c2,t){
  const a=hexToRgb(c1), b=hexToRgb(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}
// value scaled 0..1 where 1 = "good" -> teal, 0 = "bad" -> red, mid -> panel bg-ish
function goodScaleColor(t){
  t = Math.max(0,Math.min(1,t));
  if(t>0.5) return mixColor('#3A3F46', COLORS.teal, (t-0.5)*2);
  return mixColor(COLORS.red, '#3A3F46', t*2);
}

// ---------- SVG bar chart (horizontal) ----------
function hBarChart({data, valueFmt=(v)=>fmtNum(v,2), colorFn=null, width=620, barH=22, gap=8, zeroLine=false, unit=''}){
  const entries = Object.entries(data).filter(([,v])=>v!==null&&v!==undefined&&!isNaN(v));
  if(entries.length===0) return '<div class="empty-state">No data for current filters</div>';
  entries.sort((a,b)=>b[1]-a[1]);
  const vals = entries.map(e=>e[1]);
  const min = Math.min(0, ...vals), max = Math.max(0, ...vals);
  const labelW = 56, padR = 60;
  const plotW = width - labelW - padR;
  const zeroX = labelW + (0 - min)/(max-min || 1) * plotW;
  const h = entries.length*(barH+gap)+10;
  let bars = '';
  entries.forEach(([name,val],i)=>{
    const y = i*(barH+gap)+8;
    const x1 = labelW + (Math.min(0,val) - min)/(max-min||1)*plotW;
    const x2 = labelW + (Math.max(0,val) - min)/(max-min||1)*plotW;
    const w = Math.max(1, x2-x1);
    const color = colorFn ? colorFn(val) : COLORS.gold;
    const textX = val>=0 ? x2+6 : x1-6;
    const anchor = val>=0 ? 'start' : 'end';
    bars += `<text x="${labelW-8}" y="${y+barH/2+4}" text-anchor="end" class="barlabel">${name}</text>`;
    bars += `<rect x="${x1}" y="${y}" width="${w}" height="${barH}" fill="${color}" rx="1"/>`;
    bars += `<text x="${textX}" y="${y+barH/2+4}" text-anchor="${anchor}" class="barval">${valueFmt(val)}${unit}</text>`;
  });
  let zeroL = zeroLine ? `<line x1="${zeroX}" y1="2" x2="${zeroX}" y2="${h-4}" stroke="${COLORS.dim}" stroke-width="1" stroke-dasharray="2,3"/>` : '';
  return `<svg viewBox="0 0 ${width} ${h}" width="100%" height="${h}">${zeroL}${bars}</svg>`;
}

// ---------- heatmap table ----------
function heatmapTable({pivotData, years, goodDirection='low', center=null, digits=1, excludedNote=null}){
  const companies = Object.keys(pivotData);
  if(companies.length===0) return '<div class="empty-state">No data for current filters</div>';
  // gather all values for scaling
  let all = [];
  companies.forEach(c=> years.forEach(y=>{ const v=pivotData[c][y]; if(v!==null&&v!==undefined&&!isNaN(v)) all.push(v); }));
  if(all.length===0) return '<div class="empty-state">No data for current filters</div>';
  let min = Math.min(...all), max = Math.max(...all);
  if(center!==null){ const m = Math.max(Math.abs(min-center), Math.abs(max-center)); min = center-m; max = center+m; }
  // sort companies by their row average (best first)
  const rowAvg = {};
  companies.forEach(c=>{ const vals = years.map(y=>pivotData[c][y]).filter(v=>v!==null&&v!==undefined&&!isNaN(v)); rowAvg[c]=mean(vals); });
  const sorted = [...companies].sort((a,b)=>{
    const av=rowAvg[a], bv=rowAvg[b];
    if(av===null) return 1; if(bv===null) return -1;
    return goodDirection==='low' ? av-bv : bv-av;
  });
  let head = `<th class="rowhead">Company</th>` + years.map(y=>`<th>${y}</th>`).join('') + `<th>Avg</th>`;
  let rows = sorted.map(c=>{
    let cells = years.map(y=>{
      const v = pivotData[c][y];
      if(v===null||v===undefined||isNaN(v)) return `<td class="empty">·</td>`;
      let t = (v-min)/(max-min||1);
      if(goodDirection==='low') t = 1-t;
      const bg = goodScaleColor(t);
      return `<td style="background:${bg}">${v.toFixed(digits)}</td>`;
    }).join('');
    const avgv = rowAvg[c];
    return `<tr><td class="rowhead">${c}</td>${cells}<td class="rowhead" style="text-align:center;color:var(--gold)">${avgv!==null?avgv.toFixed(digits):'—'}</td></tr>`;
  }).join('');
  return `<div class="heatwrap"><table class="heat"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`
    + (excludedNote ? `<div class="note-box">${excludedNote}</div>` : '');
}

// ---------- scatter (quadrant) ----------
const QUADRANT_META = {
  big_profitable:{label:'Big & profitable', color:COLORS.teal},
  big_low_profit:{label:'Big, low profitability', color:COLORS.gold},
  small_efficient:{label:'Small but efficient', color:COLORS.blue},
  small_low_profit:{label:'Small & low profitability', color:COLORS.dim},
};
function quadrantScatter(rows, width=620, height=440){
  if(rows.length===0) return '<div class="empty-state">No data for current filters</div>';
  const pad = 46;
  const plotW = width-pad*2, plotH = height-pad*2;
  const xs = rows.map(r=>r.size_rank_inv), ys = rows.map(r=>r.profitability_rank_inv);
  const xMin=1, xMax = Math.max(...xs, 12), yMin=1, yMax=Math.max(...ys, 12);
  const X = v => pad + (v-xMin)/(xMax-xMin||1)*plotW;
  const Y = v => height-pad - (v-yMin)/(yMax-yMin||1)*plotH;
  const midX = X(5.5), midY = Y(5.5);
  let dots = rows.map(r=>{
    const meta = QUADRANT_META[r.quadrant];
    const x=X(r.size_rank_inv), y=Y(r.profitability_rank_inv);
    return `<g><circle cx="${x}" cy="${y}" r="6" fill="${meta.color}" fill-opacity="0.85" stroke="${meta.color}"/>
    <text x="${x+9}" y="${y+4}" class="barlabel" font-size="11">${r.company}</text></g>`;
  }).join('');
  const gridlines = `
    <line x1="${pad}" y1="${height-pad}" x2="${width-pad}" y2="${height-pad}" stroke="${COLORS.grid}"/>
    <line x1="${pad}" y1="${pad-8}" x2="${pad}" y2="${height-pad}" stroke="${COLORS.grid}"/>
    <line x1="${midX}" y1="${pad-8}" x2="${midX}" y2="${height-pad}" stroke="${COLORS.grid}" stroke-dasharray="2,3"/>
    <line x1="${pad}" y1="${midY}" x2="${width-pad}" y2="${midY}" stroke="${COLORS.grid}" stroke-dasharray="2,3"/>
  `;
  const axisLabels = `
    <text x="${width/2}" y="${height-8}" text-anchor="middle" class="axislabel">← smaller · avg. size rank (inverted) · bigger →</text>
    <text x="14" y="${height/2}" text-anchor="middle" class="axislabel" transform="rotate(-90 14 ${height/2})">← less profitable · avg. profitability rank (inv) · more profitable →</text>
  `;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${gridlines}${dots}${axisLabels}</svg>`;
}

// ---------- diverging bar (centered) ----------
function divergingBar(data, center, width=620, barH=22, gap=8, unit=''){
  const entries = Object.entries(data).filter(([,v])=>v!==null&&!isNaN(v)).map(([k,v])=>[k,v-center]);
  return hBarChart({data:Object.fromEntries(entries), colorFn:(v)=> v>=0?COLORS.teal:COLORS.red, zeroLine:true, width, barH, gap, valueFmt:(v)=>fmtNum(v+center,2)+unit});
}

function renderOverview(){
  const yoyRows = filterRows(RAW.yoy);
  const profRows = filterRows(RAW.prof);
  const compRows = filterRows(RAW.comp);
  const growthRows = filterRows(RAW.growth);

  // quadrant recompute from filtered prof rows
  const byC = {};
  profRows.forEach(r=>{ (byC[r.company]=byC[r.company]||{s:[],p:[]}); byC[r.company].s.push(r.size_rank_inv); byC[r.company].p.push(r.profitability_rank_inv); });
  const quadRows = Object.keys(byC).map(c=>{
    const s = mean(byC[c].s), p = mean(byC[c].p);
    let q;
    if(s>=5.5 && p>=5.5) q='big_profitable';
    else if(s>=5.5) q='big_low_profit';
    else if(p>=5.5) q='small_efficient';
    else q='small_low_profit';
    return {company:c, size_rank_inv:s, profitability_rank_inv:p, quadrant:q};
  });

  // win rate
  const wins = {}, elig = {};
  compRows.forEach(r=>{ elig[r.company] = (elig[r.company]||new Set()); elig[r.company].add(r.year); if(r.composite_rank===1){ wins[r.company]=(wins[r.company]||0)+1; } });
  const winRate = {};
  Object.keys(elig).forEach(c=>{ winRate[c] = (wins[c]||0)/elig[c].size; });

  const numCompanies = activeCompanies().length;
  const yFrom = state.yFrom, yTo = state.yTo;
  let topCompany = '—', topRate=-1;
  Object.entries(winRate).forEach(([c,v])=>{ if(v>topRate){topRate=v;topCompany=c;} });
  const pctPositive = (()=>{ const vals = growthRows.map(r=>r.real_growth_pct).filter(v=>v!==null&&v!==undefined); if(!vals.length) return null; return 100*vals.filter(v=>v>0).length/vals.length; })();

  const legend = Object.entries(QUADRANT_META).map(([k,m])=>`<span><span class="dot" style="background:${m.color}"></span>${m.label}</span>`).join('');

  return `
  <div class="grid cols-4" style="margin-bottom:18px;">
    <div class="panel kpi"><div class="label">Companies in view</div><div class="value">${numCompanies}</div><div class="note">of ${RAW.companies.length} in dataset</div></div>
    <div class="panel kpi"><div class="label">Years covered</div><div class="value">${yFrom}–${yTo}</div><div class="note">full range ${RAW.years[0]}–${RAW.years[RAW.years.length-1]}</div></div>
    <div class="panel kpi"><div class="label">Most consistent winner</div><div class="value accent">${topCompany}</div><div class="note">${topRate>=0?fmtPct(topRate*100,0):'—'} of eligible years ranked #1</div></div>
    <div class="panel kpi"><div class="label">Real growth positive</div><div class="value">${pctPositive!==null?fmtPct(pctPositive,0):'—'}</div><div class="note">of company-years beat inflation</div></div>
  </div>
  <div class="grid cols-2">
    <div class="panel">
      <h2>Size vs. profitability</h2>
      <p class="sub">Average rank position, all years in view · lower-left quadrant lines mark the median</p>
      ${quadrantScatter(quadRows)}
      <div class="legend">${legend}</div>
    </div>
    <div class="panel">
      <h2>Composite win rate</h2>
      <p class="sub">Share of eligible years each company ranked #1 on the combined ROE / ROA / cash-quality score</p>
      ${hBarChart({data:winRate, colorFn:()=>COLORS.gold, valueFmt:(v)=>fmtPct(v*100,0)})}
    </div>
  </div>`;
}

function renderGrowth(){
  const yoyRows = filterRows(RAW.yoy);
  const growthRows = filterRows(RAW.growth);
  const avgYoy = groupAvg(yoyRows, 'yoy_growth');
  const avgNominal = groupAvg(growthRows, 'nominal_growth_pct');
  const avgReal = groupAvg(growthRows, 'real_growth_pct');
  const companies = Object.keys(avgNominal).sort((a,b)=> (avgReal[b]||0)-(avgReal[a]||0));

  let dualBars = '';
  const width=680, barH=16, gap=22, groupGap=8;
  const vals = companies.flatMap(c=>[avgNominal[c]||0, avgReal[c]||0]);
  const min = Math.min(0,...vals), max = Math.max(0,...vals);
  const labelW=56, padR=70, plotW = width-labelW-padR;
  const zeroX = labelW + (0-min)/(max-min||1)*plotW;
  let y=8; let svgRows='';
  companies.forEach(c=>{
    [['Nominal',avgNominal[c],COLORS.blue],['Real',avgReal[c],COLORS.gold]].forEach(([label,val,color])=>{
      val = val||0;
      const x1 = labelW+(Math.min(0,val)-min)/(max-min||1)*plotW;
      const x2 = labelW+(Math.max(0,val)-min)/(max-min||1)*plotW;
      const textX = val>=0? x2+6:x1-6; const anchor = val>=0?'start':'end';
      svgRows += `<rect x="${x1}" y="${y}" width="${Math.max(1,x2-x1)}" height="${barH}" fill="${color}" rx="1"/>`;
      svgRows += `<text x="${textX}" y="${y+barH/2+4}" text-anchor="${anchor}" class="barval">${fmtNum(val,1)}%</text>`;
      y+=barH+3;
    });
    svgRows += `<text x="${labelW-8}" y="${y-((barH+3)*2)/2+4}" text-anchor="end" class="barlabel">${c}</text>`;
    y += groupGap;
  });
  const h = y+6;
  dualBars = `<svg viewBox="0 0 ${width} ${h}" width="100%" height="${h}"><line x1="${zeroX}" y1="0" x2="${zeroX}" y2="${h}" stroke="${COLORS.dim}" stroke-dasharray="2,3"/>${svgRows}</svg>`;

  return `
  <div class="grid cols-2">
    <div class="panel">
      <h2>Average YoY revenue growth</h2>
      <p class="sub">Simple average of year-over-year revenue growth, by company</p>
      ${hBarChart({data:avgYoy, colorFn:(v)=>v>=0?COLORS.teal:COLORS.red, valueFmt:(v)=>fmtNum(v,1), unit:'%', zeroLine:true})}
    </div>
    <div class="panel">
      <h2>Nominal vs. real growth</h2>
      <p class="sub">Blue = as reported · gold = after subtracting that year's U.S. inflation</p>
      ${dualBars}
      <div class="legend"><span><span class="dot" style="background:${COLORS.blue}"></span>Nominal</span><span><span class="dot" style="background:${COLORS.gold}"></span>Real (inflation-adjusted)</span></div>
    </div>
  </div>
  <div class="panel textcol" style="margin-top:18px;">
    <h3>Reading these two charts</h3>
    <p><strong>Nominal growth</strong> is revenue growth exactly as reported — no adjustments. <strong>Real growth</strong> subtracts that year's U.S. inflation rate, isolating how much of the reported growth reflects the business actually expanding versus prices across the economy simply rising. The wider the gap between a company's nominal and real bar, the more inflation was doing the work behind an otherwise impressive-looking growth number.</p>
  </div>`;
}

function renderReturns(){
  const effRows = filterRows(RAW.eff);
  const gapRows = filterRows(RAW.gap);
  const effPivot = pivot(effRows, 'avg_rank');
  const avgGap = groupAvg(gapRows, 'rank_gap');
  return `
  <div class="panel" style="margin-bottom:18px;">
    <h2>Average rank — ROE, ROA &amp; ROI combined</h2>
    <p class="sub">Rank 1 = best that year across all three return measures · lower (teal) is stronger, higher (red) is weaker</p>
    ${heatmapTable({pivotData:effPivot, years:RAW.years.filter(inYearRange), goodDirection:'low', digits:2})}
  </div>
  <div class="panel">
    <h2>Where ROE and ROA ranks disagree</h2>
    <p class="sub">Positive (teal) = ROA rank beats ROE rank, real strength without leverage · negative (red) = ROE looks better than ROA, often a debt effect</p>
    ${hBarChart({data:avgGap, colorFn:(v)=>v>=0?COLORS.teal:COLORS.red, zeroLine:true, valueFmt:(v)=>fmtNum(v,2)})}
  </div>
  <div class="panel textcol" style="margin-top:18px;">
    <h3>Why compare ROE to ROA</h3>
    <p>ROE measures return relative to equity; ROA measures return relative to <em>all</em> assets, debt included. A company can inflate its ROE by borrowing more without truly becoming more efficient — comparing the two ranks surfaces that gap directly.</p>
  </div>`;
}

function renderLeverage(){
  const debtRows = filterRows(RAW.debt);
  const eqRows = filterRows(RAW.eq);
  const debtPivot = pivot(debtRows, 'debt_equity');
  const avgCfNi = groupAvg(eqRows, 'cf_to_ni_ratio');
  const parityBar = {};
  Object.entries(avgCfNi).forEach(([c,v])=>{ if(v!==null) parityBar[c]=v; });

  return `
  <div class="panel" style="margin-bottom:18px;">
    <h2>Debt / equity ratio</h2>
    <p class="sub">Centered at zero · blue-leaning = conservative leverage, red-leaning = high leverage. Negative values mean liabilities exceed assets (negative equity).</p>
    ${heatmapTable({pivotData:debtPivot, years:RAW.years.filter(inYearRange), goodDirection:'low', center:0, digits:2})}
  </div>
  <div class="panel">
    <h2>Cash flow vs. net income — distance from 1.0x parity</h2>
    <p class="sub">Average operating cash flow ÷ net income, shown as distance above parity (1.0x = cash exactly matches reported profit)</p>
    ${divergingBar(parityBar, 1, 620, 22, 8, 'x')}
  </div>
  <div class="panel textcol" style="margin-top:18px;">
    <h3>Reading these two measures</h3>
    <p><strong>Debt/Equity</strong> shows reliance on borrowed money versus a company's own capital. <strong>Cash flow vs. net income</strong> asks whether reported profit is actually backed by cash — a ratio above 1.0x is generally a marker of higher-quality earnings, though an unusually high one can also reflect heavy non-cash add-backs rather than genuinely stronger operations.</p>
    <p>Note: this ratio is a weaker signal for banks, whose cash flow is driven by trading and financing activity rather than ordinary operations. Negative debt/equity values (liabilities exceeding assets) can come from very different situations — a company in real financial distress, or a healthy company that borrowed to fund share buybacks — so they're worth investigating individually rather than reading as a single signal.</p>
  </div>`;
}

function renderMargins(){
  const ebitdaRows = filterRows(RAW.ebitda);
  const valRows = filterRows(RAW.val);
  const compRows = filterRows(RAW.comp);
  const ebitdaPivot = pivot(ebitdaRows, 'ebitda_margin');
  const avgValRank = groupAvg(valRows, 'valuation_rank');
  const valSummary = {};
  const byC = {};
  valRows.forEach(r=>{ (byC[r.company]=byC[r.company]||[]).push(r.market_cap_to_ni); });
  Object.keys(byC).forEach(c=>{
    const arr = byC[c].filter(v=>v!==null&&v!==undefined).sort((a,b)=>a-b);
    if(!arr.length) return;
    const m = mean(arr);
    const med = arr.length%2? arr[(arr.length-1)/2] : (arr[arr.length/2-1]+arr[arr.length/2])/2;
    const variance = mean(arr.map(v=>(v-m)**2));
    valSummary[c] = {mean:m, median:med, std:Math.sqrt(variance)};
  });

  const wins = {}, elig = {};
  compRows.forEach(r=>{ elig[r.company]=(elig[r.company]||new Set()); elig[r.company].add(r.year); if(r.composite_rank===1) wins[r.company]=(wins[r.company]||0)+1; });

  const diagRows = Object.keys(elig).sort((a,b)=>{
    const ra=(wins[a]||0)/elig[a].size, rb=(wins[b]||0)/elig[b].size; return rb-ra;
  }).map(c=>{
    const w = wins[c]||0, e = elig[c].size, wr = w/e;
    const vs = valSummary[c] || {mean:null,median:null,std:null};
    return `<tr><td>${c}</td><td>${vs.mean!==null?fmtNum(vs.mean,2):'—'}</td><td>${vs.median!==null?fmtNum(vs.median,2):'—'}</td><td>${vs.std!==null?fmtNum(vs.std,2):'—'}</td><td>${w}</td><td>${e}</td><td style="color:var(--gold)">${fmtPct(wr*100,0)}</td></tr>`;
  }).join('');

  const excludedNote = RAW.ebitda_excluded.length
    ? `<b>Note:</b> ${RAW.ebitda_excluded.join(', ')} excluded from this chart — source data reports EBITDA = 1 for every year, indicating missing data rather than a genuine near-zero margin.`
    : null;

  return `
  <div class="panel" style="margin-bottom:18px;">
    <h2>EBITDA margin</h2>
    <p class="sub">Share of revenue converted to EBITDA · teal = strong conversion, red = weak</p>
    ${heatmapTable({pivotData:ebitdaPivot, years:RAW.years.filter(inYearRange), goodDirection:'high', digits:1, excludedNote})}
  </div>
  <div class="grid cols-2">
    <div class="panel">
      <h2>Relative valuation rank</h2>
      <p class="sub">Rank 1 = market prices this company richest relative to earnings that year, all years averaged</p>
      ${hBarChart({data:avgValRank, colorFn:()=>COLORS.blue, valueFmt:(v)=>fmtNum(v,1)})}
    </div>
    <div class="panel">
      <h2>Supporting detail</h2>
      <p class="sub">Valuation spread (Market Cap ÷ Net Income) and composite score win-rate ingredients</p>
      <div style="overflow-x:auto;">
      <table class="diag">
        <thead><tr><th style="text-align:left;">Company</th><th>Mean</th><th>Median</th><th>StdDev</th><th>Wins</th><th>Elig. yrs</th><th>Win rate</th></tr></thead>
        <tbody>${diagRows}</tbody>
      </table>
      </div>
    </div>
  </div>
  <div class="panel textcol" style="margin-top:18px;">
    <h3>Why rank instead of the raw ratio</h3>
    <p>Market Cap ÷ Net Income can spike into the hundreds when a company's net income is small in a given year — the Mean vs. Median columns above show how far apart those can drift for the same company. Using each year's <em>rank</em> instead keeps a single extreme year from distorting the multi-year picture.</p>
  </div>`;
}

        <p>A twelve-company financial review, ${RAW.years[0]}–${RAW.years[RAW.years.length-1]} — built from the same measures validated in the companion Power BI report.</p>
      </div>
      <div class="meta">SOURCE · Kaggle: Financial Statements of Major Companies<br>COVERAGE · <b>${RAW.companies.length}</b> companies · <b>${RAW.years.length}</b> fiscal years<br>ALL FIGURES IN REPORTED USD UNLESS NOTED</div>
    </header>
    <nav class="tabs">
      ${PAGES.map(p=>`<button data-page="${p.id}" class="${state.page===p.id?'active':''}">${p.label}</button>`).join('')}
    </nav>
    <div class="filterbar">
      <div class="filtergroup">
        <span class="flabel">Company</span>
        <span class="chip all" id="chip-all">ALL</span>
        <span class="chip all" id="chip-none">NONE</span>
        ${companyChips()}
      </div>
      <div class="filtergroup">
        <span class="flabel">Years</span>
        <select class="yearsel" id="yfrom"></select>
        <span style="color:var(--text-faint)">–</span>
        <select class="yearsel" id="yto"></select>
      </div>
      <div class="filter-hint">${activeCompanies().length} of ${RAW.companies.length} companies · ${state.yFrom}–${state.yTo}</div>
    </div>
    <div class="pages">
      ${PAGES.map(p=>`<div class="page ${state.page===p.id?'active':''}" id="page-${p.id}"></div>`).join('')}
    </div>
    <div class="footer">
      <span>LEDGER &amp; LINE — mock analytical review, not investment advice</span>
      <span>Generated from exported CSVs · matches Power BI companion report</span>
    </div>
  `;

  const yFromSel = document.getElementById('yfrom');
  const yToSel = document.getElementById('yto');
  RAW.years.forEach(y=>{
    yFromSel.innerHTML += `<option value="${y}" ${y===state.yFrom?'selected':''}>${y}</option>`;
    yToSel.innerHTML += `<option value="${y}" ${y===state.yTo?'selected':''}>${y}</option>`;
  });

  document.getElementById(`page-${state.page}`).innerHTML = PAGES.find(p=>p.id===state.page).render();

  // events
  app.querySelectorAll('nav.tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.page = b.dataset.page; render(); });
  });
  app.querySelectorAll('.chip[data-company]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const c = chip.dataset.company;
      if(state.companies.has(c)) state.companies.delete(c); else state.companies.add(c);
      renderCurrentPageOnly();
      updateChipsAndHint();
    });
  });
  document.getElementById('chip-all').addEventListener('click', ()=>{ state.companies = new Set(RAW.companies); renderCurrentPageOnly(); updateChipsAndHint(); });
  document.getElementById('chip-none').addEventListener('click', ()=>{ state.companies = new Set(); renderCurrentPageOnly(); updateChipsAndHint(); });
  yFromSel.addEventListener('change', ()=>{ state.yFrom = parseInt(yFromSel.value); if(state.yFrom>state.yTo) state.yTo=state.yFrom; renderCurrentPageOnly(); updateChipsAndHint(); });
  yToSel.addEventListener('change', ()=>{ state.yTo = parseInt(yToSel.value); if(state.yTo<state.yFrom) state.yFrom=state.yTo; renderCurrentPageOnly(); updateChipsAndHint(); });
}

function renderCurrentPageOnly(){
  document.getElementById(`page-${state.page}`).innerHTML = PAGES.find(p=>p.id===state.page).render();
}
function updateChipsAndHint(){
  document.querySelectorAll('.chip[data-company]').forEach(chip=>{
    chip.classList.toggle('on', state.companies.has(chip.dataset.company));
  });
  document.querySelector('.filter-hint').textContent = `${activeCompanies().length} of ${RAW.companies.length} companies · ${state.yFrom}–${state.yTo}`;
}

render();
</script>
</body>
</html>
